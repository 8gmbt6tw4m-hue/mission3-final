<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>이도와 소헌왕후의 비밀 기록</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 18px;
    background: #f5eee2;
    font-family: Arial, "Noto Sans KR", sans-serif;
    color: #30251f;
}

.container {
    max-width: 500px;
    margin: 20px auto;
}

.card {
    background: #fffaf1;
    border: 3px solid #30251f;
    border-radius: 20px;
    padding: 30px 22px;
    box-shadow: 6px 6px 0 #30251f;
    text-align: center;
}

.mission {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 8px;
}

h1 {
    margin: 0 0 18px;
    font-size: 27px;
}

.description {
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 15px;
    border: 2px solid #30251f;
    border-radius: 10px;
    background: white;
    font-size: 17px;
    text-align: center;
    outline: none;
}

button {
    width: 100%;
    margin-top: 12px;
    padding: 15px;
    border: 2px solid #30251f;
    border-radius: 10px;
    background: #30251f;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    font-size: 16px;
    line-height: 1.8;
}

.correct {
    padding: 20px;
    background: #f3e4bd;
    border-radius: 15px;
    border: 2px solid #30251f;
}

.wrong {
    padding: 20px;
    background: #eeeeee;
    border-radius: 15px;
    border: 2px solid #30251f;
}

.hint {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px dashed #30251f;
    font-size: 15px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="mission">
MISSION 03
</div>

<h1>🔎 이도와 소헌왕후의 비밀 기록</h1>

<div class="description">
파티룸 곳곳에 숨겨진<br>
<strong>3개의 글자 조각</strong>을 모두 찾았나요?<br><br>

찾은 글자들을 잘 조합하여<br>
<strong>이도와 소헌왕후가 남긴 진짜 단어</strong>를 입력해주세요.
</div>

<input
type="text"
id="answer"
placeholder="완성한 단어를 입력하세요"
autocomplete="off"
>

<button onclick="checkAnswer()">
확인
</button>

<div id="result"></div>

</div>

</div>

<script>

function checkAnswer() {

const answer = document
.getElementById("answer")
.value
.trim();

const result = document.getElementById("result");

if (answer === "함께한") {

result.innerHTML = `
<div class="correct">

🎃 <strong>정답입니다!</strong>

<div class="hint">

여기까지 왔다면 거의 다 찾았구나!<br><br>

마지막 조각은 생각보다 가까운 곳에 숨겨져 있단다.<br><br>

우리가 처음 너희를 기다리며<br>
사건파일을 전달했던 그곳으로 다시 돌아와<br>
마지막 기록을 확인해주렴!

</div>

</div>
`;

} else {

result.innerHTML = `
<div class="wrong">

❌ <strong>아직 맞는 단어가 아니에요.</strong><br><br>

찾은 글자들을 다시 조합해보세요!

</div>
`;

}

}

</script>

</body>
</html>
